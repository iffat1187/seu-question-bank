<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Upload Paper — SEU Question Bank</title>
</head>
<body>
<section>
    <div class="container py-4" style="max-width: 760px;">
        <a th:href="@{/question-papers}" class="btn btn-ghost btn-sm mb-3"><i class="bi bi-arrow-left me-1"></i> Back to Papers</a>

        <div class="card-seu p-4">
            <h3 class="text-white fw-bold mb-1"><i class="bi bi-cloud-arrow-up me-2 text-purple"></i>Upload Question Paper</h3>
            <p class="small mb-4" style="color: var(--text-secondary);">Status will be <span class="badge badge-elective">PENDING</span> until ADMIN approves. Upload up to <strong class="text-white">5 images</strong> (JPG, PNG, WEBP, max 5MB each).</p>

            <form th:action="@{/question-papers/create}" th:object="${questionPaper}" method="post" enctype="multipart/form-data" novalidate>
                <div th:if="${#fields.hasErrors('*')}" class="alert py-2 small mb-3" style="background: rgba(244,63,94,0.12); border:1px solid rgba(244,63,94,0.25); color:#fda4af; border-radius:10px;">
                    Please fix the errors below.
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="courseCode" class="form-label small fw-semibold" style="color: var(--text-secondary);">Course Code *</label>
                        <select id="courseCode" th:field="*{courseCode}" class="form-control form-control-seu" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''">
                            <option value="">Select course</option>
                            <option th:each="c : ${courses}" th:value="${c.courseCode}" th:text="${c.courseCode + ' — ' + c.title}">CSE141</option>
                        </select>
                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="courseTitle" class="form-label small fw-semibold" style="color: var(--text-secondary);">Course Title (auto)</label>
                        <input type="text" id="courseTitle" th:field="*{courseTitle}" class="form-control form-control-seu" placeholder="Auto-filled from course">
                    </div>
                    <div class="col-md-6">
                        <label for="facultyName" class="form-label small fw-semibold" style="color: var(--text-secondary);">Faculty Name</label>
                        <input type="text" id="facultyName" th:field="*{facultyName}" class="form-control form-control-seu" placeholder="e.g. Dr. Rahman">
                    </div>
                    <div class="col-md-3">
                        <label for="semester" class="form-label small fw-semibold" style="color: var(--text-secondary);">Semester</label>
                        <select id="semester" th:field="*{semester}" class="form-control form-control-seu">
                            <option value="">Select</option>
                            <option value="Spring">Spring</option>
                            <option value="Fall">Fall</option>
                            <option value="Summer">Summer</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="academicYear" class="form-label small fw-semibold" style="color: var(--text-secondary);">Year</label>
                        <input type="number" id="academicYear" th:field="*{academicYear}" class="form-control form-control-seu" placeholder="2026" min="2000" max="2100">
                    </div>
                    <div class="col-md-6">
                        <label for="examType" class="form-label small fw-semibold" style="color: var(--text-secondary);">Exam Type</label>
                        <select id="examType" th:field="*{examType}" class="form-control form-control-seu">
                            <option value="">Select</option>
                            <option th:each="et : ${examTypes}" th:value="${et}" th:text="${et}">FINAL</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="imageFiles" class="form-label small fw-semibold" style="color: var(--text-secondary);">Question Images * <span class="fw-normal" style="color: var(--text-muted);">(max 5, JPG/PNG/WEBP, 5MB each)</span></label>
                        <input type="file" id="imageFiles" name="imageFiles" class="form-control form-control-seu" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple>
                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('imageUrls')}" th:errors="*{imageUrls}"></div>
                        <div id="fileError" class="small mt-1" style="color:#fda4af; display:none;"></div>
                        <div id="preview" class="row g-2 mt-3"></div>
                        <div class="small mt-2" style="color: var(--text-muted);">Images will be uploaded to Cloudinary and saved as secure URLs. Status will be PENDING.</div>
                    </div>
                    <!-- Fallback for old URL input (hidden, for backward compat) -->
                    <textarea id="imageUrlsText" name="imageUrlsText" class="d-none" th:text="${imageUrlsText}"></textarea>
                </div>
                <button type="submit" class="btn btn-purple w-100 mt-4 py-2">Submit for Approval <i class="bi bi-send ms-1"></i></button>
            </form>
        </div>
    </div>
    <script>
        (function(){
            const input = document.getElementById('imageFiles');
            const preview = document.getElementById('preview');
            const err = document.getElementById('fileError');
            if(!input) return;
            const allowed = ['image/jpeg','image/jpg','image/png','image/webp'];
            const maxSize = 5*1024*1024;
            const maxFiles = 5;
            input.addEventListener('change', function(){
                preview.innerHTML = '';
                err.style.display='none';
                err.textContent='';
                const files = Array.from(input.files);
                if(files.length > maxFiles){
                    err.textContent = 'Maximum ' + maxFiles + ' images allowed (selected ' + files.length + ')';
                    err.style.display='block';
                    input.value='';
                    return;
                }
                for(const file of files){
                    if(file.size > maxSize){
                        err.textContent = file.name + ' exceeds 5MB limit';
                        err.style.display='block';
                        input.value='';
                        preview.innerHTML='';
                        return;
                    }
                    if(!allowed.includes(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)){
                        err.textContent = file.name + ' has unsupported type. Allowed: JPG, PNG, WEBP';
                        err.style.display='block';
                        input.value='';
                        preview.innerHTML='';
                        return;
                    }
                }
                files.forEach(file=>{
                    const reader = new FileReader();
                    reader.onload = e=>{
                        const col = document.createElement('div');
                        col.className='col-4 col-md-3';
                        col.innerHTML = '<div class="card-seu p-1"><img src="'+e.target.result+'" alt="preview" class="img-fluid rounded" style="height:110px; width:100%; object-fit:cover; background: var(--bg-secondary);"><div class="small text-truncate mt-1" style="color: var(--text-muted);">'+file.name+'</div></div>';
                        preview.appendChild(col);
                    };
                    reader.readAsDataURL(file);
                });
            });
        })();
    </script>
</section>
</body>
</html>
