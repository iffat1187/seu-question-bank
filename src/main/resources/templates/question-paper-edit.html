<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Edit Paper — SEU Question Bank</title>
</head>
<body>
<section>
    <div class="container py-4" style="max-width: 760px;">
        <a th:href="@{'/question-papers/' + ${questionPaper.id}}" class="btn btn-ghost btn-sm mb-3"><i class="bi bi-arrow-left me-1"></i> Back to Details</a>

        <div class="card-seu p-4">
            <h3 class="text-white fw-bold mb-1"><i class="bi bi-pencil me-2 text-purple"></i>Edit Question Paper</h3>
            <p class="small mb-4" style="color: var(--text-secondary);">
                <span th:if="${!isAdmin}">You can edit your own <strong class="text-white">PENDING</strong> paper. Keep existing images or add new (max 5 total).</span>
                <span th:if="${isAdmin}">ADMIN: you can edit any paper, change status, and manage images.</span>
            </p>

            <form th:action="@{'/question-papers/' + ${questionPaper.id} + '/edit'}" th:object="${questionPaper}" method="post" enctype="multipart/form-data" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="courseCode" class="form-label small fw-semibold" style="color: var(--text-secondary);">Course Code *</label>
                        <select id="courseCode" th:field="*{courseCode}" class="form-control form-control-seu" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''">
                            <option value="">Select course</option>
                            <option th:each="c : ${courses}" th:value="${c.courseCode}" th:text="${c.courseCode + ' — ' + c.title}">CSE141</option>
                        </select>
                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="courseTitle" class="form-label small fw-semibold" style="color: var(--text-secondary);">Course Title</label>
                        <input type="text" id="courseTitle" th:field="*{courseTitle}" class="form-control form-control-seu">
                    </div>
                    <div class="col-md-6">
                        <label for="facultyName" class="form-label small fw-semibold" style="color: var(--text-secondary);">Faculty Name</label>
                        <input type="text" id="facultyName" th:field="*{facultyName}" class="form-control form-control-seu">
                    </div>
                    <div class="col-md-3">
                        <label for="semester" class="form-label small fw-semibold" style="color: var(--text-secondary);">Semester</label>
                        <select id="semester" th:field="*{semester}" class="form-control form-control-seu">
                            <option value="">Select</option>
                            <option value="Spring">Spring</option>
                            <option value="Fall">Fall</option>
                            <option value="Summer">Summer</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="academicYear" class="form-label small fw-semibold" style="color: var(--text-secondary);">Year</label>
                        <input type="number" id="academicYear" th:field="*{academicYear}" class="form-control form-control-seu" min="2000" max="2100">
                    </div>
                    <div class="col-md-6">
                        <label for="examType" class="form-label small fw-semibold" style="color: var(--text-secondary);">Exam Type</label>
                        <select id="examType" th:field="*{examType}" class="form-control form-control-seu">
                            <option value="">Select</option>
                            <option th:each="et : ${examTypes}" th:value="${et}" th:text="${et}">FINAL</option>
                        </select>
                    </div>
                    <div class="col-md-6" th:if="${isAdmin}">
                        <label for="status" class="form-label small fw-semibold" style="color: var(--text-secondary);">Status (ADMIN)</label>
                        <select id="status" name="status" class="form-control form-control-seu">
                            <option th:each="s : ${paperStatuses}" th:value="${s}" th:text="${s}" th:selected="${s.name() == questionPaper.status.name()}">PENDING</option>
                        </select>
                    </div>

                    <!-- Existing images -->
                    <div class="col-12" th:if="${existingImageUrls != null and !existingImageUrls.isEmpty()}">
                        <label class="form-label small fw-semibold" style="color: var(--text-secondary);">Existing Images (check to keep)</label>
                        <div class="row g-2">
                            <div th:each="url, iter : ${existingImageUrls}" class="col-6 col-md-4">
                                <div class="card-seu p-2 text-center">
                                    <img th:src="${url}" alt="existing" class="img-fluid rounded mb-2" style="height:110px; width:100%; object-fit:cover; background: var(--bg-secondary);" onerror="this.style.display='none'">
                                    <div class="form-check d-flex justify-content-center gap-2">
                                        <input class="form-check-input" type="checkbox" name="existingImageUrls" th:value="${url}" th:id="${'keep_' + iter.index}" checked>
                                        <label class="form-check-label small" th:for="${'keep_' + iter.index}" style="color: var(--text-secondary);">Keep</label>
                                    </div>
                                    <div class="small text-truncate" style="color: var(--text-muted); word-break: break-all;" th:text="${url}">url</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="imageFiles" class="form-label small fw-semibold" style="color: var(--text-secondary);">Add New Images <span class="fw-normal" style="color: var(--text-muted);">(max 5 total, JPG/PNG/WEBP, 5MB each)</span></label>
                        <input type="file" id="imageFiles" name="imageFiles" class="form-control form-control-seu" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple>
                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('imageUrls')}" th:errors="*{imageUrls}"></div>
                        <div id="fileError" class="small mt-1" style="color:#fda4af; display:none;"></div>
                        <div id="preview" class="row g-2 mt-3"></div>
                    </div>
                    <textarea id="imageUrlsText" name="imageUrlsText" class="d-none" th:text="${imageUrlsText}"></textarea>
                </div>
                <button type="submit" class="btn btn-purple w-100 mt-4 py-2">Save Changes <i class="bi bi-check-lg ms-1"></i></button>
            </form>

            <form th:action="@{'/question-papers/' + ${questionPaper.id} + '/delete'}" method="post" class="mt-3" onsubmit="return confirm('Delete this paper permanently? Cloudinary images will be removed if ADMIN.');">
                <button type="submit" class="btn btn-ghost w-100" style="color:#fda4af; border-color: rgba(244,63,94,0.3);"><i class="bi bi-trash me-1"></i> Delete Paper</button>
            </form>
        </div>
    </div>
    <script>
        (function(){
            const input = document.getElementById('imageFiles');
            const preview = document.getElementById('preview');
            const err = document.getElementById('fileError');
            if(!input) return;
            const allowed = ['image/jpeg','image/jpg','image/png','image/webp'];
            const maxSize = 5*1024*1024;
            const maxFiles = 5;
            input.addEventListener('change', function(){
                preview.innerHTML = '';
                err.style.display='none';
                err.textContent='';
                const files = Array.from(input.files);
                const existingCount = document.querySelectorAll('input[name=\"existingImageUrls\"]:checked').length;
                const total = files.length + existingCount;
                if(total > maxFiles){
                    err.textContent = 'Total images would be ' + total + ' (max ' + maxFiles + '). Uncheck some existing or select fewer.';
                    err.style.display='block';
                    input.value='';
                    return;
                }
                for(const file of files){
                    if(file.size > maxSize){
                        err.textContent = file.name + ' exceeds 5MB';
                        err.style.display='block';
                        input.value='';
                        preview.innerHTML='';
                        return;
                    }
                    if(!allowed.includes(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)){
                        err.textContent = file.name + ' unsupported type';
                        err.style.display='block';
                        input.value='';
                        preview.innerHTML='';
                        return;
                    }
                }
                files.forEach(file=>{
                    const reader = new FileReader();
                    reader.onload = e=>{
                        const col = document.createElement('div');
                        col.className='col-4 col-md-3';
                        col.innerHTML = '<div class=\"card-seu p-1\"><img src=\"'+e.target.result+'\" class=\"img-fluid rounded\" style=\"height:110px; width:100%; object-fit:cover;\"><div class=\"small text-truncate mt-1\" style=\"color: var(--text-muted);\">'+file.name+'</div></div>';
                        preview.appendChild(col);
                    };
                    reader.readAsDataURL(file);
                });
            });
            document.querySelectorAll('input[name=\"existingImageUrls\"]').forEach(cb=>{
                cb.addEventListener('change', function(){
                    const checked = document.querySelectorAll('input[name=\"existingImageUrls\"]:checked').length;
                    const newFiles = input.files ? input.files.length : 0;
                    if(checked + newFiles > maxFiles){
                        err.textContent = 'Total would exceed ' + maxFiles;
                        err.style.display='block';
                    } else {
                        err.style.display='none';
                    }
                });
            });
        })();
    </script>
</section>
</body>
</html>
