<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Profile — SEU Question Bank</title>
</head>
<body>
<section>
    <div class="container py-5" style="max-width: 620px;">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="d-flex align-items-center justify-content-center rounded-3" style="width:48px; height:48px; background: var(--purple-soft); border:1px solid var(--purple-border);"><i class="bi bi-person text-purple" style="font-size:1.4rem;"></i></div>
            <div>
                <h2 class="text-white fw-bold mb-0" style="letter-spacing:-0.02em;">Your Profile</h2>
                <p class="small mb-0" style="color: var(--text-secondary);">Authenticated session — manage your account</p>
            </div>
        </div>

        <div class="card-seu p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="d-flex align-items-center justify-content-center rounded-circle text-white fw-bold" style="width:64px; height:64px; background: linear-gradient(135deg, var(--purple-primary), #4f46e5); font-size:1.25rem;" th:text="${#strings.substring(user.name,0,1).toUpperCase()}">A</div>
                <div>
                    <h5 class="text-white mb-0" th:text="${user.name}">Student Name</h5>
                    <p class="small mb-1" style="color: var(--text-secondary);" th:text="${user.email}">student@seu.edu.bd</p>
                    <span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-project' : 'badge-purple'" th:text="${user.role}">STUDENT</span>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-sm-6">
                    <div class="p-3 rounded-3" style="background: var(--bg-secondary); border:1px solid var(--border);">
                        <div class="small" style="color: var(--text-muted); text-transform: uppercase; letter-spacing:0.06em; font-weight:600;">Name</div>
                        <div class="text-white fw-semibold" th:text="${user.name}">Name</div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="p-3 rounded-3" style="background: var(--bg-secondary); border:1px solid var(--border);">
                        <div class="small" style="color: var(--text-muted); text-transform: uppercase; letter-spacing:0.06em; font-weight:600;">Email</div>
                        <div class="text-white fw-semibold" th:text="${user.email}" style="word-break: break-all;">email</div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="p-3 rounded-3" style="background: var(--bg-secondary); border:1px solid var(--border);">
                        <div class="small" style="color: var(--text-muted); text-transform: uppercase; letter-spacing:0.06em; font-weight:600;">Role</div>
                        <div class="text-white fw-semibold" th:text="${user.role}">STUDENT</div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="p-3 rounded-3" style="background: var(--bg-secondary); border:1px solid var(--border);">
                        <div class="small" style="color: var(--text-muted); text-transform: uppercase; letter-spacing:0.06em; font-weight:600;">Member Since</div>
                        <div class="text-white fw-semibold" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">2026-09-23</div>
                    </div>
                </div>
            </div>

            <hr style="border-color: var(--border); opacity:0.6;" class="my-4">

            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/courses}" class="btn btn-ghost"><i class="bi bi-book me-1"></i> Browse Courses</a>
                <form th:action="@{/logout}" method="post" class="ms-auto">
                    <button type="submit" class="btn btn-purple"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
                </form>
            </div>
        </div>

        <div class="small text-center mt-3" style="color: var(--text-muted);">
            Session-based authentication • BCrypt secured • <span th:text="${user.role}">STUDENT</span> access
        </div>
    </div>
</section>
</body>
</html>
