<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Login — SEU Question Bank</title>
</head>
<body>
<section>
    <div class="container py-5" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3" style="width:52px; height:52px; background: var(--purple-soft); border:1px solid var(--purple-border);"><i class="bi bi-box-arrow-in-right text-purple" style="font-size:1.4rem;"></i></div>
            <h2 class="text-white fw-bold" style="letter-spacing:-0.02em;">Welcome back</h2>
            <p class="small" style="color: var(--text-secondary);">Log in to access your profile and future features</p>
        </div>

        <div class="card-seu p-4">
            <!-- Success / error alerts -->
            <div th:if="${param.registered}" class="alert alert-success py-2 small" style="background: rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.25); color:#86efac; border-radius:10px;">
                <i class="bi bi-check-circle me-1"></i> Registration successful! Please log in.
            </div>
            <div th:if="${param.error}" class="alert py-2 small" style="background: rgba(244,63,94,0.12); border:1px solid rgba(244,63,94,0.25); color:#fda4af; border-radius:10px;">
                <i class="bi bi-exclamation-triangle me-1"></i> Invalid email or password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert py-2 small" style="background: rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.25); color:#7dd3fc; border-radius:10px;">
                <i class="bi bi-box-arrow-right me-1"></i> You have been logged out successfully.
            </div>
            <div th:if="${success}" class="alert py-2 small" style="background: rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.25); color:#86efac; border-radius:10px;" th:text="${success}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold" style="color: var(--text-secondary);">Email</label>
                    <input type="email" id="username" name="username" class="form-control form-control-seu" placeholder="you@seu.edu.bd" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold" style="color: var(--text-secondary);">Password</label>
                    <input type="password" id="password" name="password" class="form-control form-control-seu" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn btn-purple w-100 py-2">Log In <i class="bi bi-arrow-right ms-1"></i></button>
            </form>

            <div class="text-center small mt-3" style="color: var(--text-secondary);">
                Don’t have an account? <a th:href="@{/register}" class="text-purple" style="text-decoration:none; font-weight:600;">Create one</a>
            </div>
        </div>

        <div class="text-center small mt-3">
            <a th:href="@{/}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
        </div>
    </div>
</section>
</body>
</html>
